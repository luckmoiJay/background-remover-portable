<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本機去背工具</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">本機圖片去背</p>
            <h1>去背工作台</h1>
          </div>
          <div class="status-pill" id="statusPill">待命</div>
        </header>

        <div class="stage-grid">
          <section class="tool-panel">
            <div class="panel-section active" id="removePane">
              <label class="dropzone" id="dropzone">
                <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" />
                <span class="drop-icon">+</span>
                <strong>拖放、貼上或選擇圖片</strong>
                <small>Windows 截圖後按 Ctrl+V 即可貼上，也支援 PNG / JPG / WebP。</small>
              </label>

              <div class="paste-hint" id="pasteHint">
                <span class="kbd">Ctrl</span>
                <span class="kbd">V</span>
                <span>從剪貼簿貼上截圖</span>
              </div>

              <div class="controls">
                <label class="toggle-row">
                  <span>細緻邊緣修正</span>
                  <input id="alphaMatting" type="checkbox" checked />
                </label>
                <label>
                  <span>邊緣柔化</span>
                  <input id="feather" type="range" min="0" max="8" value="1" />
                </label>
                <label>
                  <span>銳利度</span>
                  <input id="sharpen" type="range" min="0" max="220" value="25" />
                </label>
                <label>
                  <span>前景保留</span>
                  <input id="foregroundThreshold" type="range" min="80" max="255" value="240" />
                </label>
                <label>
                  <span>背景移除</span>
                  <input id="backgroundThreshold" type="range" min="1" max="120" value="10" />
                </label>
                <label class="toggle-row">
                  <span>自動裁切透明邊</span>
                  <input id="trim" type="checkbox" checked />
                </label>
              </div>

              <button class="primary-action" id="removeBtn" type="button" disabled>開始去背</button>
            </div>
          </section>

          <section class="preview-panel">
            <div class="preview-toolbar">
              <div class="segmented">
                <button class="view-btn active" data-view="transparent" type="button">透明</button>
                <button class="view-btn" data-view="checker" type="button">格紋</button>
                <button class="view-btn" data-view="original" type="button">原圖</button>
              </div>
              <a class="download disabled" id="downloadBtn" download="background-removed.png">下載 PNG</a>
            </div>
            <div class="preview-canvas checker" id="previewCanvas">
              <img id="previewImage" alt="" />
              <div class="empty-state" id="emptyState">
                <strong>結果會顯示在這裡</strong>
                <span>透明 PNG 可直接下載使用。</span>
              </div>
            </div>
            <div class="meta-row">
              <span id="fileMeta">尚未載入圖片</span>
              <span id="engineMeta">本機處理</span>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
